name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version consistency
        shell: pwsh
        run: |
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { $package }
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1
          $cargoVersion = $cargo.Matches[0].Groups[1].Value
          if ($tag -and ($tag -ne $package -or $tag -ne $tauri -or $tag -ne $cargoVersion)) {
            throw "Tag ($tag), package.json ($package), tauri.conf.json ($tauri), and Cargo.toml ($cargoVersion) must match."
          }

      - name: Test application
        run: pnpm check

      - name: Build, sign and publish NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 健康提醒 v__VERSION__
          releaseBody: |
            Windows 安装包与应用内更新清单由 GitHub Actions 自动生成。
            Windows installer and signed in-app update metadata generated by GitHub Actions.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
