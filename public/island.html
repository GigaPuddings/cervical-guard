<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ipc: http://ipc.localhost http://guard.localhost" />
  <title>健康提醒</title>
  <style>
    @property --peek-x { syntax: '<length>'; inherits: true; initial-value: 180px; }
    @property --peek-y { syntax: '<length>'; inherits: true; initial-value: 38px; }
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { padding: 0; user-select: none; }
    .island {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 9px;
      padding: 8px 10px; color: #f7faf7; border: 0; border-radius: 22px;
      background: linear-gradient(118deg, rgba(12,18,14,.98), rgba(25,35,28,.97));
      box-shadow: none;
      opacity: 0; transform: translateY(-8px) scale(.94);
      transition: opacity .16s ease, transform .2s cubic-bezier(.2,.8,.2,1), --peek-x .1s linear, --peek-y .1s linear;
    }
    body.ready .island { opacity: 1; transform: none; }
    body.peek-through.ready .island {
      opacity: 1; transform: none;
      -webkit-mask-image: radial-gradient(circle 50px at var(--peek-x) var(--peek-y), transparent 0 16px, rgba(0,0,0,.08) 24px, rgba(0,0,0,.28) 33px, rgba(0,0,0,.62) 42px, #000 50px);
      mask-image: radial-gradient(circle 50px at var(--peek-x) var(--peek-y), transparent 0 16px, rgba(0,0,0,.08) 24px, rgba(0,0,0,.28) 33px, rgba(0,0,0,.62) 42px, #000 50px);
    }
    .peek-ring {
      pointer-events: none; position: fixed; z-index: 3; left: var(--peek-x); top: var(--peek-y);
      width: 82px; height: 82px; border: 0; border-radius: 50%;
      background: radial-gradient(circle, rgba(7,13,9,.38) 0 18%, rgba(7,13,9,.27) 42%, rgba(7,13,9,.10) 62%, transparent 76%);
      box-shadow: inset 0 0 0 1px rgba(220,239,225,.07), inset 0 0 12px rgba(0,0,0,.14), 0 0 10px rgba(0,0,0,.10);
      opacity: 0; transform: translate(-50%, -50%) scale(.88);
      transition: opacity .12s ease, transform .14s ease, left .1s linear, top .1s linear;
    }
    body.peek-through.ready .peek-ring { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    body.closing .peek-ring { opacity: 0; }
    body.ready.closing .island { opacity: 0; transform: translateY(-7px) scale(.96); -webkit-mask-image: none; mask-image: none; }
    .signal {
      width: 32px; height: 32px; display: grid; place-items: center; border-radius: 11px;
      color: #ddf3e3; background: #2f6f46; box-shadow: 0 5px 14px rgba(21,82,43,.28);
    }
    .signal.away { color: #f2ddb9; background: #765827; }
    .signal.head { color: #ffe9c4; background: #815a22; }
    .signal.standing { color: #dbeaff; background: #315f91; }
    .signal svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .signal svg[hidden] { display: none; }
    .copy { min-width: 0; }
    .meta-line { display: flex; min-width: 0; align-items: center; gap: 5px; }
    .meta { display: block; min-width: 0; flex: 1; color: #8fa097; font-size: 8px; line-height: 1.2; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .weather-mini { display: inline-flex; max-width: 86px; flex: 0 0 auto; align-items: center; gap: 3px; color: #b8d9c1; font-size: 7px; font-weight: 750; white-space: nowrap; overflow: hidden; }
    .weather-mini[hidden] { display: none; }
    .weather-mini b { overflow: hidden; text-overflow: ellipsis; }
    h1 { margin: 2px 0 0; font-size: 12px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { display: flex; align-items: center; gap: 4px; }
    button {
      width: 38px; height: 28px; padding: 0; border: 1px solid rgba(255,255,255,.11); border-radius: 9px;
      color: #d4ded7; background: rgba(255,255,255,.07); font-family: inherit; font-size: 8px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.14); }
    button.primary { color: #173620; border-color: #c4dfca; background: #dff0e2; }
    button.icon { width: 27px; font-size: 14px; }
    button:disabled { opacity: .45; cursor: default; }
    body.mode-away .actions, body.mode-returned .actions, body.mode-behavior .actions { display: none; }
    body.mode-away .island, body.mode-returned .island, body.mode-behavior .island { grid-template-columns: 34px minmax(0, 1fr); }

    .detail { display: none; min-width: 0; height: 100%; padding: 12px 13px; }
    body.mode-detail .signal, body.mode-detail .copy, body.mode-detail .actions { display: none; }
    body.mode-detail .island { display: block; padding: 0; border-radius: 20px; }
    body.mode-detail .detail { display: flex; flex-direction: column; }
    .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .detail-state { min-width: 0; display: flex; align-items: center; gap: 7px; color: #dff1e3; font-size: 10px; font-weight: 750; }
    .detail-state i { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: #62c885; box-shadow: 0 0 0 4px rgba(98,200,133,.12); }
    .detail-state span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-date { flex: 0 0 auto; color: #788a80; font-size: 8px; }
    .detail-weather { display: flex; min-height: 23px; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 5px 8px; border-radius: 8px; color: #b9d9c1; background: rgba(98,200,133,.075); font-size: 8px; }
    .detail-weather[hidden] { display: none; }
    .detail-weather b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-weather span { flex: 0 0 auto; color: #7f9988; font-size: 7px; }
    .detail-main { display: grid; grid-template-columns: 1fr 1.2fr; align-items: end; gap: 14px; margin-top: 9px; }
    .detail-time small, .detail-next small { display: block; color: #81958a; font-size: 8px; font-weight: 650; }
    .detail-time strong { display: block; margin-top: 2px; font-size: 25px; line-height: 1; letter-spacing: -.04em; }
    .detail-next { min-width: 0; padding-left: 13px; border-left: 1px solid rgba(255,255,255,.08); }
    .detail-next strong { display: block; margin-top: 3px; color: #d4e8d9; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
    .detail-stat { min-width: 0; padding: 7px 8px; border: 1px solid rgba(255,255,255,.075); border-radius: 10px; background: rgba(255,255,255,.035); }
    .detail-stat small { display: block; color: #7f9287; font-size: 7px; }
    .detail-stat strong { display: block; margin-top: 2px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (prefers-reduced-motion: reduce) { .island { transition-duration: .01ms; } }
  </style>
</head>
<body>
  <section class="island" role="dialog" aria-modal="false" aria-labelledby="title">
    <div class="signal" id="signal" aria-hidden="true">
      <svg id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>
      <svg id="icon-away" viewBox="0 0 24 24" hidden><circle cx="10" cy="8" r="4"></circle><path d="M3 21v-1a7 7 0 0 1 11.3-5.5"></path><path d="M17 17l4 4m0-4-4 4"></path></svg>
      <svg id="icon-back" viewBox="0 0 24 24" hidden><circle cx="10" cy="8" r="4"></circle><path d="M3 21v-1a7 7 0 0 1 11.3-5.5"></path><path d="m16 19 2 2 4-4"></path></svg>
      <svg id="icon-head" viewBox="0 0 24 24" hidden><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2"></path><path d="m9 12 3 3 3-3"></path></svg>
      <svg id="icon-standing" viewBox="0 0 24 24" hidden><circle cx="12" cy="4" r="2"></circle><path d="m9 22 1-7-2-4 1-4h6l1 4-2 4 1 7"></path></svg>
    </div>
    <div class="copy">
      <div class="meta-line">
        <span class="meta" id="meta">健康提醒</span>
        <span class="weather-mini" id="weather-mini" hidden>
          <b id="weather-text"></b>
        </span>
      </div>
      <h1 id="title">该舒展一下了</h1>
    </div>
    <div class="actions">
      <button class="primary" data-command="start_break">休息</button>
      <button data-command="snooze_reminder" data-minutes="10">稍后</button>
      <button class="icon" title="忽略本次" aria-label="忽略本次" data-command="dismiss_reminder">×</button>
    </div>
    <div class="detail" id="detail">
      <div class="detail-head">
        <div class="detail-state"><i></i><span id="d-state">监测中</span></div>
        <span class="detail-date" id="d-date"></span>
      </div>
      <div class="detail-weather" id="d-weather" hidden><b id="d-weather-main"></b><span id="d-weather-meta"></span></div>
      <div class="detail-main">
        <div class="detail-time"><small>连续坐姿</small><strong id="d-seated">0秒</strong></div>
        <div class="detail-next"><small>下一次提醒</small><strong id="d-next">正在计算</strong></div>
      </div>
      <div class="detail-stats">
        <div class="detail-stat"><small>今日坐姿</small><strong id="d-today">0分钟</strong></div>
        <div class="detail-stat"><small>已完成休息</small><strong id="d-breaks">0 次</strong></div>
        <div class="detail-stat"><small>离座活动</small><strong id="d-away">0分钟</strong></div>
      </div>
    </div>
  </section>
  <div class="peek-ring" aria-hidden="true"></div>
  <script>
    (() => {
      const api = window.__TAURI__;
      const body = document.body;
      const island = document.querySelector('.island');
      const signal = document.querySelector('#signal');
      const meta = document.querySelector('#meta');
      const title = document.querySelector('#title');
      const weatherMini = document.querySelector('#weather-mini');
      const weatherText = document.querySelector('#weather-text');
      const buttons = [...document.querySelectorAll('button')];
      const icons = {
        bell: document.querySelector('#icon-bell'),
        away: document.querySelector('#icon-away'),
        back: document.querySelector('#icon-back'),
        head: document.querySelector('#icon-head'),
        standing: document.querySelector('#icon-standing'),
      };
      let mode = 'idle';
      let hideTimer = 0;
      let collapseTimer = 0;
      let refreshTimer = 0;
      let lastSnapshot = null;
      let weatherSummary = null;
      let metaBase = '健康提醒';

      const duration = (seconds) => {
        const value = Math.max(0, Math.floor(Number(seconds) || 0));
        if (value < 60) return `${value}秒`;
        const minutes = Math.floor(value / 60);
        if (minutes < 60) return `${minutes}分钟`;
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        return rest ? `${hours}时${rest}分` : `${hours}小时`;
      };
      const clearTimers = () => {
        clearTimeout(hideTimer); clearTimeout(collapseTimer); clearInterval(refreshTimer);
        hideTimer = 0; collapseTimer = 0; refreshTimer = 0;
      };
      const setIcon = (name) => {
        Object.entries(icons).forEach(([key, node]) => { node.hidden = key !== name; });
        signal.classList.toggle('away', name === 'away');
        signal.classList.toggle('head', name === 'head');
        signal.classList.toggle('standing', name === 'standing');
      };
      const renderMeta = (value) => {
        metaBase = value;
        meta.textContent = value;
        weatherMini.hidden = !weatherSummary;
        if (!weatherSummary) return;
        weatherText.textContent = `${weatherSummary.condition} ${Math.round(Number(weatherSummary.temperature) || 0)}°`;
        weatherMini.title = `${weatherSummary.location} · ${weatherSummary.condition} · ${Math.round(Number(weatherSummary.temperature) || 0)}°`;
      };
      const renderWeatherDetail = () => {
        const node = document.querySelector('#d-weather');
        node.hidden = !weatherSummary;
        if (!weatherSummary) return;
        document.querySelector('#d-weather-main').textContent = `${weatherSummary.location} · ${weatherSummary.condition} ${Math.round(Number(weatherSummary.temperature) || 0)}°`;
        document.querySelector('#d-weather-meta').textContent = `湿度 ${Math.round(Number(weatherSummary.humidity) || 0)}% · UV ${Number(weatherSummary.uvIndex || 0).toFixed(1)}`;
      };
      const updateWeather = (summary) => {
        if (!summary || typeof summary !== 'object' || !summary.location) {
          weatherSummary = null;
          renderMeta(metaBase);
          renderWeatherDetail();
          return;
        }
        weatherSummary = summary;
        renderMeta(metaBase);
        renderWeatherDetail();
      };
      const setPeekThrough = (payload) => {
        const active = Boolean(payload && typeof payload === 'object' ? payload.active : payload);
        if (active && Number.isFinite(payload.x) && Number.isFinite(payload.y)) {
          body.style.setProperty('--peek-x', `${payload.x}px`);
          body.style.setProperty('--peek-y', `${payload.y}px`);
        }
        body.classList.toggle('peek-through', active);
      };
      const enterMode = (next) => {
        clearTimers(); mode = next;
        const keepPeekThrough = body.classList.contains('peek-through');
        body.className = `mode-${next}`;
        if (keepPeekThrough) body.classList.add('peek-through');
        requestAnimationFrame(() => body.classList.add('ready'));
      };
      const hide = async (animated = true) => {
        clearTimers(); mode = 'idle';
        if (animated) {
          body.classList.add('closing');
          await new Promise((resolve) => setTimeout(resolve, 170));
        }
        body.className = '';
        if (api) await api.window.getCurrentWindow().hide();
      };

      const renderReminder = (reminder) => {
        if (!reminder) return;
        setIcon('bell');
        renderMeta(`已连续 ${duration(reminder.durationSeconds)}`);
        title.textContent = reminder.title || '该舒展一下了';
        enterMode('reminder');
      };
      const renderAway = () => {
        setIcon('away');
        renderMeta('坐姿计时已暂停');
        title.textContent = '你已离开座位';
        enterMode('away');
      };
      const renderReturned = () => {
        setIcon('back');
        renderMeta('已恢复本地监测');
        title.textContent = '欢迎回来';
        enterMode('returned');
        hideTimer = setTimeout(() => void hide(true), 2200);
      };
      const dismissBehavior = async () => {
        if (mode !== 'behavior') return;
        clearTimers(); mode = 'idle'; body.classList.add('closing');
        await new Promise((resolve) => setTimeout(resolve, 170));
        if (mode !== 'idle') return;
        body.className = '';
        if (!api) return;
        try { await api.core.invoke('dismiss_behavior_notice'); }
        catch { await api.window.getCurrentWindow().hide(); }
      };
      const renderBehavior = (snapshot) => {
        const behavior = snapshot && snapshot.behavior;
        if (behavior === 'head_down') {
          setIcon('head');
          renderMeta('姿态已持续确认');
          title.textContent = '检测到低头，请抬高视线';
        } else if (behavior === 'standing_break') {
          setIcon('standing');
          renderMeta('坐姿计时已暂停');
          title.textContent = '你站起来了，活动一下吧';
        } else {
          return;
        }
        enterMode('behavior');
        hideTimer = setTimeout(() => void dismissBehavior(), 6000);
      };
      const stateLabel = (snapshot) => {
        if (snapshot.lifecycle === 'paused') return '检测已暂停';
        if (snapshot.lifecycle === 'break') return '休息进行中';
        const labels = {
          no_person: '已离座 · 计时暂停', present: '正在确认坐姿', sitting_normal: '姿态自然 · 正在计时',
          head_down: '持续低头中', standing_break: '站立活动中', unknown: '等待稳定画面',
        };
        return labels[snapshot.behavior] || '本地监测中';
      };
      const nextLabel = (snapshot) => {
        if (snapshot.lifecycle === 'break') return `休息剩余 ${duration(snapshot.breakRemainingSeconds)}`;
        if (snapshot.lifecycle === 'paused') return '恢复检测后继续';
        if (snapshot.currentReminder) return '提醒等待处理';
        if (snapshot.nextReminderAt) {
          const date = new Date(snapshot.nextReminderAt);
          if (!Number.isNaN(date.getTime())) return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }
        if (snapshot.monitoringMode === 'camera') return '稳定坐姿后开始计时';
        return snapshot.reminderRemainingSeconds == null ? '按当前规则暂停' : `还需 ${duration(snapshot.reminderRemainingSeconds)}`;
      };
      const fillDetail = (snapshot) => {
        if (!snapshot) return;
        lastSnapshot = snapshot;
        const now = new Date();
        document.querySelector('#d-date').textContent = `${now.getMonth() + 1}月${now.getDate()}日`;
        document.querySelector('#d-state').textContent = stateLabel(snapshot);
        document.querySelector('#d-seated').textContent = duration(snapshot.seatedSeconds);
        document.querySelector('#d-next').textContent = nextLabel(snapshot);
        document.querySelector('#d-today').textContent = duration(snapshot.today.seatedSeconds);
        document.querySelector('#d-breaks').textContent = `${snapshot.today.breakCount} 次`;
        document.querySelector('#d-away').textContent = duration(snapshot.today.awaySeconds || 0);
        renderWeatherDetail();
      };
      const refreshDetail = async () => {
        if (mode !== 'detail' || !api) return;
        try { fillDetail(await api.core.invoke('get_app_snapshot')); } catch { /* 下一轮再试 */ }
      };
      const renderDetail = (snapshot) => {
        fillDetail(snapshot);
        enterMode('detail');
        refreshTimer = setInterval(refreshDetail, 1000);
      };
      const collapseDetail = async () => {
        if (mode !== 'detail') return;
        clearTimers(); mode = 'idle'; body.classList.add('closing');
        await new Promise((resolve) => setTimeout(resolve, 170));
        if (mode !== 'idle') return;
        body.className = '';
        if (api) {
          try { await api.core.invoke('collapse_island_detail'); }
          catch { await api.window.getCurrentWindow().hide(); }
        }
      };
      const scheduleCollapse = () => {
        if (mode !== 'detail') return;
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => void collapseDetail(), 180);
      };
      const perform = async (button) => {
        if (!api) return;
        buttons.forEach((item) => { item.disabled = true; });
        try {
          const minutes = button.dataset.minutes ? Number(button.dataset.minutes) : undefined;
          await api.core.invoke(button.dataset.command, minutes === undefined ? undefined : { minutes });
          await hide(true);
        } finally {
          buttons.forEach((item) => { item.disabled = false; });
        }
      };
      buttons.forEach((button) => button.addEventListener('click', () => void perform(button)));

      if (!api) {
        updateWeather({ location: '南京', condition: '多云', temperature: 27, humidity: 68, uvIndex: 4.2, weatherCode: 2 });
        const preview = {
          lifecycle: 'monitoring', behavior: 'sitting_normal', monitoringMode: 'camera', seatedSeconds: 1530,
          nextReminderAt: new Date(Date.now() + 1170 * 1000).toISOString(), reminderRemainingSeconds: 1170,
          today: { seatedSeconds: 8100, breakCount: 2, awaySeconds: 540 },
        };
        if (location.hash === '#detail') renderDetail(preview);
        else if (location.hash === '#away') renderAway();
        else if (location.hash === '#returned') renderReturned();
        else if (location.hash === '#head') renderBehavior({ behavior: 'head_down' });
        else if (location.hash === '#standing') renderBehavior({ behavior: 'standing_break' });
        else renderReminder({ durationSeconds: 1530, title: '该舒展一下了' });
        return;
      }

      void api.event.listen('reminder://triggered', (event) => renderReminder(event.payload));
      void api.event.listen('island://away', () => renderAway());
      void api.event.listen('island://returned', () => renderReturned());
      void api.event.listen('island://behavior', (event) => renderBehavior(event.payload));
      void api.event.listen('island://detail', (event) => {
        clearTimeout(collapseTimer);
        if (mode === 'detail') fillDetail(event.payload);
        else renderDetail(event.payload);
      });
      void api.event.listen('island://hover-left', scheduleCollapse);
      void api.event.listen('island://peek-through', (event) => setPeekThrough(event.payload));
      void api.event.listen('weather://summary', (event) => updateWeather(event.payload));

      void api.core.invoke('get_app_snapshot').then((snapshot) => {
        lastSnapshot = snapshot;
        if (snapshot.currentReminder) renderReminder(snapshot.currentReminder);
        else setTimeout(() => { if (mode === 'idle') void hide(false); }, 500);
      }).catch(() => void hide(false));
    })();
  </script>
</body>
</html>
